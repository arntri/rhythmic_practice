name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The suite is pure Dart and widget tests — no emulator needed, and no
      # Supabase credentials: omitting --dart-define-from-file leaves the app
      # local-only, which is the configuration the tests expect. Device-gated
      # paths (live mic, playback, keystore, gallery) are verified by hand
      # instead; see APP_OVERVIEW.md section 15.
      - name: Test
        run: flutter test --reporter expanded
